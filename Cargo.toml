[workspace]
members = [
  "crates/relay-contracts",
  "crates/relay-core",
  "crates/relay-adapter",
  "crates/relay-cli",
  "crates/relayd",
]
exclude = ["spikes/phase1/rust"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = { version = "0.11.0", default-features = false }
windows-sys = "0.61.2"
